<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliyo Store</title>
    <style>
        /* 1. إعدادات الألوان العامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #a8e6cf; /* اللون السماوي */
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 2. تصميم القائمة الجانبية */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            height: 100%;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .logo-container {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #eeeeee;
            margin-bottom: 20px;
        }

        .logo-container h1 {
            color: #a8e6cf;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-container p {
            font-size: 14px;
            color: #888888;
        }

        /* 3. تصميم أزرار التنقل */
        .nav-links {
            list-style: none;
        }

        .nav-links li a {
            display: block;
            padding: 15px 25px;
            text-decoration: none;
            color: #555555;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background-color: #f0f8ff;
            color: #a8e6cf;
            border-left: 5px solid #a8e6cf;
        }

        /* 4. تصميم المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .main-content h2 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .main-content p {
            color: #555555;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <div class="logo-container">
            <h1>Aliyo Store</h1>
            <p>آليو ستور</p>
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Applications</a></li>
            <li><a href="#">Mods</a></li>
            <li><a href="#">Featured</a></li>
            <li><a href="#">Search</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h2>Welcome to Aliyo Store</h2>
        <p>Select a category from the side menu to get started.</p>
    </div>

</body>
</html>
